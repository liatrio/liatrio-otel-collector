---
# Tags the module set at the version in versions.yaml and creates the GitHub Release (which triggers
# release.yml). Runs when a release PR from cut-release.yml merges; no-op if the tag already exists.
name: create-release

on:
  push:
    branches: [main]
    paths: [versions.yaml]
  # Manual recovery, e.g. a prepared version that was never tagged.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get Octo STS Token
        uses: octo-sts/action@210248e8ae1ae1550aa6e232c6f192b3ccbf7335
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: semantic-release

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          fetch-depth: 0

      - name: Check release version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(yq '.module-sets.liatrio-otel.version' versions.yaml)
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREVIOUS=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "Releasing $VERSION (previous: $PREVIOUS)"
          {
            echo "skip=false"
            echo "version=$VERSION"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.version.outputs.skip == 'false'
        with:
          go-version: 1.27

      - name: Install tools
        if: steps.version.outputs.skip == 'false'
        run: make install-tools

      - name: Import GPG key
        if: steps.version.outputs.skip == 'false'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Get GitHub App User ID
        if: steps.version.outputs.skip == 'false'
        id: get-user-id
        run: echo "user-id=$(gh api "/users/octo-sts[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}

      - name: Multimod Push Tags
        if: steps.version.outputs.skip == 'false'
        env:
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          set -eo pipefail
          git config --global user.name 'octo-sts[bot]'
          git config --global user.email "$USER_ID+octo-sts[bot]@users.noreply.github.com"
          ./.tools/multimod tag --module-set-name liatrio-otel --commit-hash "$GITHUB_SHA" --print-tags
          git push --tags

      # Must use the octo-sts token: releases created with GITHUB_TOKEN don't trigger release.yml.
      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          gh release create "$VERSION" --generate-notes --notes-start-tag "$PREVIOUS" --target "$GITHUB_SHA"
