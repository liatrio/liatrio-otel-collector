---
name: build-and-test

on:
  pull_request:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - '**/.dockerignore'
      - .github/**
      - '**.go'
      - '**.mod'
      - '**.sum'
      - config/**
      - '**/Makefile*'
      - '**/documentation.md'
      - .golangci.yaml
      - .goreleaser.yaml

  push:
    branches: [main]

jobs:
  lint:
    # Always run 1) if the branch isn't main OR 2) if the branch is main and the actor isn't octo-sts[bot]
    if: github.ref != 'refs/heads/main' || ( github.ref == 'refs/heads/main' && github.actor != 'octo-sts[bot]')
    strategy:
      matrix:
        go: ['1.26']
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Make install-tools
        run: make install-tools

      - name: Make lint-all
        run: make lint-all

      - name: Check Code Generation
        run: |
          make generate
          if ! git diff --quiet; then
            echo "Generated code is out of date. Run make generate and commit the changes."
            exit 1
          fi

      - name: Check Packages Are Up-to-Date
        run: |
          make tidy-all
          if ! git diff --quiet; then
            echo "Packages are out of date. Run make tidy-all and commit the changes."
            exit 1
          fi

      - name: Check Crosslink Run
        run: |
          make crosslink
          if ! git diff --quiet; then
            echo "Replace statements not updated. Run make crosslink and commit the changes."
            exit 1
          fi

  generate:
    if: github.ref != 'refs/heads/main' || ( github.ref == 'refs/heads/main' && github.actor != 'octo-sts[bot]')
    strategy:
      matrix:
        go: ['1.26']
    name: generate
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Make install-tools
        run: make install-tools

      - name: Check Code Generation
        run: |
          make generate
          if ! git diff --quiet; then
            echo "Generated code is out of date. Run make generate and commit the changes."
            exit 1
          fi

      - name: Check Packages Are Up-to-Date
        run: |
          make tidy-all
          if ! git diff --quiet; then
            echo "Packages are out of date. Run make tidy-all and commit the changes."
            exit 1
          fi

  regen:
    name: regen
    needs: [generate, lint]
    # Only runs when Tier 1 (generate/lint) failed on a renovate[bot] PR, and never on a push made
    # by the octo-sts bot itself (this job's own commit re-triggers `synchronize`, which would
    # otherwise recurse). This is a plain AND, not the repo's default OR'd/ref-negated guard, because
    # this job must never run on `main` or on non-Renovate PRs regardless of failure() state.
    #
    # Excludes `dependency-major-update`-labelled PRs (label applied by renovate.json). A Go major
    # bump is an import-path migration whose new require is unused until imports are rewritten — a
    # judgment-tier change Tier 1's `make tidy-all` cannot do, and would in fact silently drop the
    # require. Those PRs flow past regen to the LLM tier (the /fix agent) instead.
    if: failure() && github.event.pull_request.user.login == 'renovate[bot]' && github.actor != 'octo-sts[bot]' && !contains(github.event.pull_request.labels.*.name, 'dependency-major-update')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Consumed by notify-fix-needed so a successful Tier-1 push does not also spam Slack
    # (a new CI run follows the push; the card waits for that post-regen outcome).
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Get Octo STS Token
        uses: octo-sts/action@210248e8ae1ae1550aa6e232c6f192b3ccbf7335
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: regen

      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Do not leave the write-capable octo-sts token in the git credential store for the
          # duration of the job — the regen steps below run PR-provided (Renovate-bumped) code, so
          # the push step authenticates explicitly instead of relying on a persisted credential.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/octo-sts[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}

      - name: Configure git committer
        run: |
          git config user.name 'octo-sts[bot]'
          git config user.email '${{ steps.get-user-id.outputs.user-id }}+octo-sts[bot]@users.noreply.github.com'

      - name: Make install-tools
        run: make install-tools

      - name: Run mechanical regeneration
        run: |
          make generate
          make tidy-all
          make crosslink
          make fmt-all

      - name: Refuse to push workflow changes
        run: |
          if ! git diff --quiet --name-only -- .github/; then
            echo "Regeneration touched .github/** — refusing to commit/push a workflow-poisoning diff."
            git diff --name-only -- .github/
            exit 1
          fi

      # Deliberately does NOT re-apply Renovate's `rebase` label after pushing. Re-adding it would
      # tell Renovate to force-rebase the branch from the dependency update on its next run, which
      # recreates the branch and discards this foreign commit — undoing the fix and looping forever.
      # Renovate treats a foreign commit as a signal to stop auto-rebasing that branch, which is the
      # outcome we want: our fix sticks, and the PR is left for CI to go green and get merged.
      - name: Commit and push fixes
        id: push
        env:
          # Pass the untrusted, user-controllable branch name and the octo-sts token through the
          # environment rather than interpolating them into the shell — `${{ … }}` expansion happens
          # before the script runs, so a crafted head ref could otherwise inject shell commands.
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet; then
            echo "No mechanical fixes needed; nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add .
          git commit -m "chore: run make generate"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${HEAD_REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  build:
    name: build
    if: github.ref != 'refs/heads/main' || ( github.ref == 'refs/heads/main' && github.actor != 'octo-sts[bot]')
    strategy:
      matrix:
        GOOS: [darwin, linux, windows]
        GOARCH: [arm64, amd64, '386']
        go: ['1.26']
        exclude:
          - GOOS: darwin
            GOARCH: '386'
          - GOOS: darwin
            GOARCH: arm
          - GOOS: windows
            GOARCH: arm
          - GOOS: windows
            GOARCH: arm64
    runs-on:
      group: bigger
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        env:
          GGOOS: ${{ matrix.GOOS }}
          GGOARCH: ${{ matrix.GOARCH }}
        run: make build


  test:
    if: github.ref != 'refs/heads/main' || ( github.ref == 'refs/heads/main' && github.actor != 'octo-sts[bot]')
    strategy:
      matrix:
        go: ['1.26']
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Make test-all
        run: make test-all

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # Deterministic Slack approval card when a Renovate PR still needs Tier-2 (/fix).
  # Enabled only when repo variable SLACK_FIX_CHANNEL_ID is set. Cursor reaction automation is Part 2.
  notify-fix-needed:
    name: notify-fix-needed
    needs: [generate, lint, build, test, regen]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.actor != 'octo-sts[bot]' &&
      vars.SLACK_FIX_CHANNEL_ID != '' &&
      (
        needs.generate.result == 'failure' ||
        needs.lint.result == 'failure' ||
        needs.build.result == 'failure' ||
        needs.test.result == 'failure'
      ) &&
      !(needs.regen.result == 'success' && needs.regen.outputs.pushed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Prepare Slack card payload
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CHANNEL_ID: ${{ vars.SLACK_FIX_CHANNEL_ID }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          REGEN_RESULT: ${{ needs.regen.result }}
          IS_MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'dependency-major-update') }}
        run: |
          set -euo pipefail

          body="$(gh pr view "$PR_NUMBER" -R "$REPO" --json body --jq '.body')"
          group="$(gh pr view "$PR_NUMBER" -R "$REPO" --json labels \
            --jq '[.labels[].name | select(startswith("group:"))][0] // ""')"
          upgrades_raw="$(printf '%s' "$body" \
            | grep -o '<!-- renovate-upgrades:.*-->' \
            | sed -e 's/^<!-- renovate-upgrades://' -e 's/-->$//' || true)"
          echo "$upgrades_raw" | jq -e . >/dev/null 2>&1 || upgrades_raw='[]'
          upgrades_summary="$(printf '%s' "$upgrades_raw" | jq -r '
            if length == 0 then "_none parsed from PR body_"
            else
              [.[0:8][] |
                "- `\(.depName // .name // "unknown")` \(.currentValue // .currentVersion // .fromVersion // "?") → \(.newValue // .newVersion // .toVersion // "?")"
              ] | join("\n")
              + (if length > 8 then "\n- …and \(length - 8) more" else "" end)
            end
          ')"

          failing=""
          for pair in "generate:${GENERATE_RESULT}" "lint:${LINT_RESULT}" "build:${BUILD_RESULT}" "test:${TEST_RESULT}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "failure" ]; then
              failing="${failing:+$failing, }${name}"
            fi
          done
          [ -n "$failing" ] || failing="unknown"

          reasons=()
          if [ "$IS_MAJOR" = "true" ] && { [ "$GENERATE_RESULT" = "failure" ] || [ "$LINT_RESULT" = "failure" ]; }; then
            reasons+=("major-update skipped Tier-1")
          elif [ "$GENERATE_RESULT" = "failure" ] || [ "$LINT_RESULT" = "failure" ]; then
            reasons+=("Tier-1 did not green (regen=${REGEN_RESULT})")
          fi
          if [ "$BUILD_RESULT" = "failure" ] || [ "$TEST_RESULT" = "failure" ]; then
            reasons+=("build/test failed")
          fi
          if [ ${#reasons[@]} -eq 0 ]; then
            reasons+=("CI failed")
          fi
          why="$(IFS='; '; printf '%s' "${reasons[*]}")"

          # Dedupe marker on the PR: <!-- slack-fix-card:{"ts":"...","sha":"..."} -->
          marker_line=""
          comment_id=""
          existing_ts=""
          existing_sha=""
          marker_line="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | test("<!-- slack-fix-card:")) | "\(.id)\t\(.body)"' \
            | head -n 1 || true)"
          if [ -n "$marker_line" ]; then
            comment_id="$(printf '%s' "$marker_line" | cut -f1)"
            marker_json="$(printf '%s' "$marker_line" | cut -f2- | grep -o '<!-- slack-fix-card:{.*} -->' \
              | sed -e 's/^<!-- slack-fix-card://' -e 's/ -->$//' || true)"
            if echo "$marker_json" | jq -e . >/dev/null 2>&1; then
              existing_ts="$(printf '%s' "$marker_json" | jq -r '.ts // empty')"
              existing_sha="$(printf '%s' "$marker_json" | jq -r '.sha // empty')"
            fi
          fi

          if [ -n "$existing_ts" ] && [ "$existing_sha" = "$HEAD_SHA" ]; then
            echo "Slack card already posted for head SHA ${HEAD_SHA} — skipping."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$existing_ts" ]; then
            echo "action=update" >> "$GITHUB_OUTPUT"
            echo "existing_ts=${existing_ts}" >> "$GITHUB_OUTPUT"
          else
            echo "action=post" >> "$GITHUB_OUTPUT"
          fi
          echo "comment_id=${comment_id}" >> "$GITHUB_OUTPUT"

          group_line="${group:-_none_}"
          # Fallback text for notifications; blocks carry the structured card.
          fallback="Tier-2 fix needed — ${REPO} PR #${PR_NUMBER}: ${PR_TITLE}"

          # Escape values for embedding in JSON strings via jq --arg.
          jq -n \
            --arg channel "$CHANNEL_ID" \
            --arg text "$fallback" \
            --arg repo "$REPO" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_url "$PR_URL" \
            --arg head_ref "$HEAD_REF" \
            --arg group_line "$group_line" \
            --arg why "$why" \
            --arg failing "$failing" \
            --arg upgrades "$upgrades_summary" \
            --arg ts "${existing_ts:-}" \
            '
            {
              channel: $channel,
              text: $text,
              blocks: [
                {
                  type: "header",
                  text: { type: "plain_text", text: "Tier-2 fix needed", emoji: true }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*<" + $pr_url + "|#" + $pr_number + " — " + $pr_title + ">*\n"
                      + "`" + $repo + "` · `" + $head_ref + "`")
                  }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*Group*\n" + $group_line) },
                    { type: "mrkdwn", text: ("*Failing jobs*\n" + $failing) }
                  ]
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ("*Why*\n" + $why) }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ("*Upgrades*\n" + $upgrades) }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "React with :wrench: to run the Tier-2 `/fix` agent.\nReact with :eyes: if a human will handle it."
                  }
                },
                {
                  type: "context",
                  elements: [
                    {
                      type: "mrkdwn",
                      text: "Approving is the same trust act as running `make build` on this PR locally. Cursor automation wiring is Part 2."
                    }
                  ]
                }
              ]
            }
            + (if $ts == "" then {} else {ts: $ts} end)
            ' > /tmp/slack-fix-card.json

          echo "Wrote /tmp/slack-fix-card.json"

      - name: Post Slack card
        id: slack_post
        if: steps.prep.outputs.action == 'post'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: /tmp/slack-fix-card.json

      - name: Update Slack card
        id: slack_update
        if: steps.prep.outputs.action == 'update'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: /tmp/slack-fix-card.json

      - name: Persist Slack card marker on the PR
        if: steps.prep.outputs.action == 'post' || steps.prep.outputs.action == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMENT_ID: ${{ steps.prep.outputs.comment_id }}
          POST_TS: ${{ steps.slack_post.outputs.ts }}
          UPDATE_TS: ${{ steps.slack_update.outputs.ts }}
        run: |
          set -euo pipefail
          SLACK_TS="${POST_TS:-${UPDATE_TS:-}}"
          if [ -z "${SLACK_TS}" ]; then
            echo "No Slack message ts returned — cannot write dedupe marker" >&2
            exit 1
          fi
          marker="<!-- slack-fix-card:$(jq -nc --arg ts "$SLACK_TS" --arg sha "$HEAD_SHA" '{ts:$ts,sha:$sha}') -->"
          body="$(printf '%s\n%s\n' '<!-- do not edit: used by notify-fix-needed to dedupe Slack cards -->' "$marker")"
          if [ -n "${COMMENT_ID:-}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
          echo "Stored slack-fix-card marker ts=${SLACK_TS} sha=${HEAD_SHA}"

  multimod-prepare-release:
    if: ${{ github.ref == 'refs/heads/main' && github.actor != 'octo-sts[bot]' }}
    needs: [lint, build]
    runs-on:
      group: bigger
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Get Octo STS Token
        uses: octo-sts/action@210248e8ae1ae1550aa6e232c6f192b3ccbf7335
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: semantic-release

      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          fetch-depth: 0

      - name: Install tools
        run: make install-tools

      - name: Get next version
        id: get_next_version
        uses: thenativeweb/get-next-version@b66ed58cb3556622f81636ca9fb483df6de0dc7a # 2.7.4
        with:
          prefix: v # optional, defaults to ''

      - name: Show the next version
        run: |
          echo ${{ steps.get_next_version.outputs.version }}
          echo ${{ steps.get_next_version.outputs.hasNextVersion }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/octo-sts[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}

      - name: Multimod release #This is so multimod prerelease can get author info
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        run: |
          set -eo pipefail
          git config --global user.name 'octo-sts[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+octo-sts[bot]@users.noreply.github.com'
          yq -i '.module-sets.liatrio-otel.version = "${{ steps.get_next_version.outputs.version }}"' versions.yaml
          git add .
          git commit -m "chore: run multimod to update versions ahead of release(version ${{ steps.get_next_version.outputs.version }})"
          make multimod-prerelease
          git push
